basePath: /api/v1
definitions:
  entity.CommentRequest:
    properties:
      comment:
        type: string
      confirmAttendant:
        type: boolean
      username:
        type: string
    required:
    - comment
    - username
    type: object
  entity.CoverRequest:
    properties:
      coverUrl:
        type: string
    required:
    - coverUrl
    type: object
  entity.CreateUserRequest:
    properties:
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  entity.EventEntryRequest:
    properties:
      endDate:
        type: string
      location:
        type: string
      locationLink:
        type: string
      order:
        type: integer
      startDate:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  entity.EventRequest:
    properties:
      events:
        items:
          $ref: '#/definitions/entity.EventEntryRequest'
        type: array
      title:
        type: string
    type: object
  entity.GalleryEntryRequest:
    properties:
      imageUrl:
        type: string
      order:
        type: integer
    required:
    - imageUrl
    type: object
  entity.GalleryRequest:
    properties:
      galleries:
        items:
          $ref: '#/definitions/entity.GalleryEntryRequest'
        type: array
    type: object
  entity.GiftEntryRequest:
    properties:
      "no":
        type: string
      order:
        type: integer
      provider:
        type: string
      providerAccount:
        type: string
      type:
        type: string
    type: object
  entity.GiftRequest:
    properties:
      gifts:
        items:
          $ref: '#/definitions/entity.GiftEntryRequest'
        type: array
    type: object
  entity.HeroRequest:
    properties:
      heroImgUrl:
        type: string
    required:
    - heroImgUrl
    type: object
  entity.InvitationRequest:
    properties:
      brideDegree:
        type: string
      brideDescription:
        type: string
      brideImgUrl:
        type: string
      brideName:
        type: string
      description:
        type: string
      groomDegree:
        type: string
      groomDescription:
        type: string
      groomImgUrl:
        type: string
      groomName:
        type: string
      title:
        type: string
    type: object
  entity.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  entity.OpeningRequest:
    properties:
      description:
        type: string
      openingImgUrl:
        type: string
      title:
        type: string
    type: object
  entity.StoryEntryRequest:
    properties:
      description:
        type: string
      order:
        type: integer
      title:
        type: string
    type: object
  entity.StoryRequest:
    properties:
      stories:
        items:
          $ref: '#/definitions/entity.StoryEntryRequest'
        type: array
      storyImgUrl:
        type: string
    type: object
  entity.UpdateUserRequest:
    properties:
      password:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      error: {}
      message:
        type: string
    type: object
host: localhost:8080
